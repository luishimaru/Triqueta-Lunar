<style>
    /* --- FOOTER --- */
    .site-footer { width: 100%; background: #0a0a0a; border-top: 1px solid #333; padding: 2rem 1rem; text-align: center; margin-top: auto; z-index: 10; }
    .social-icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
    .social-icon { color: #b3b3b3; font-size: 1.8rem; transition: color 0.3s, transform 0.3s; text-decoration: none; }
    .social-icon:hover { color: #882222; transform: translateY(-5px); }

    /* --- CARRITO GLOBAL --- */
    .floating-cart { position: fixed; bottom: 30px; right: 30px; background: linear-gradient(145deg, #882222 0%, #551111 100%); color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.8); border: 1px solid #ff4444; z-index: 1000; transition: transform 0.3s; }
    .floating-cart:hover { transform: scale(1.1); }
    .cart-badge { position: absolute; top: -5px; right: -5px; background: white; color: #882222; font-size: 12px; font-weight: bold; font-family: 'Oswald', sans-serif; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    
    .cart-sidebar { position: fixed; top: 0; right: -100%; width: 350px; max-width: 100vw; height: 100vh; background: #111; border-left: 1px solid #333; z-index: 2000; transition: right 0.4s ease; padding: 20px; display: flex; flex-direction: column; }
    .cart-sidebar.open { right: 0; }
    .close-cart { align-self: flex-end; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; margin-bottom: 20px; }
    
    .cart-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #333; }
    .cart-item img { width: 40px; height: 40px; object-fit: contain; margin-right: 10px; }
    .cart-item-info { flex-grow: 1; }
    .cart-item-title { font-family: 'Oswald', sans-serif; font-size: 0.9rem; text-transform: capitalize; overflow-wrap: break-word; word-break: break-word; line-height: 1.2; }
    .cart-controls { display: flex; align-items: center; gap: 8px; }
    .cart-btn { background: #333; color: white; border: none; width: 25px; height: 25px; border-radius: 4px; cursor: pointer; }
    .cart-btn:hover { background: #882222; }
    .add-to-cart-btn-final { width: 100%; background: #25D366; color: #111; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-family: 'Roboto', sans-serif; font-weight: bold; font-size: 1.1rem; transition: all 0.3s; }
    .add-to-cart-btn-final:hover { transform: scale(1.02); }
