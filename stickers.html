<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickers UV DTF | Triqueta Lunar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --accent-red: #882222;
            --bg-dark: #050505;
            --panel-bg: rgba(17, 17, 17, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'Roboto', sans-serif; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
        }

        .smoke-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: #050505; overflow: hidden; pointer-events: none; }
        .smoke-blob { position: absolute; border-radius: 50%; filter: blur(55px); animation: moveSmoke 15s infinite alternate ease-in-out; }
        .smoke-1 { background: radial-gradient(circle, rgba(160, 15, 15, 0.45) 0%, transparent 70%); width: 80vw; height: 80vw; top: -10%; left: -20%; }
        .smoke-2 { background: radial-gradient(circle, rgba(120, 25, 25, 0.35) 0%, transparent 70%); width: 70vw; height: 70vw; top: 40%; right: -20%; animation-delay: -5s; }
        @keyframes moveSmoke { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, -40px) scale(1.15); } }

        .container { max-width: 1000px; width: 100%; padding: 2rem 1rem; position: relative; z-index: 10; }
        .header { text-align: center; margin-bottom: 2rem; }
        .logo-img { width: 120px; filter: drop-shadow(0 0 12px rgba(255,0,0,0.2)); margin-bottom: 1rem; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; margin-top: 5px; }

        /* --- FLUJO DE PASOS --- */
        .step-panel { background: var(--panel-bg); border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 20px; transition: all 0.3s; }
        .step-panel.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(100%); }
        .step-title { font-family: 'Oswald', sans-serif; font-size: 1.5rem; color: var(--accent-red); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        .size-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .size-btn { background: #1a1a1a; border: 2px solid #333; color: white; padding: 15px 10px; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; font-family: 'Roboto', sans-serif; }
        .size-btn:hover { border-color: #666; background: #252525; }
        .size-btn.active { border-color: var(--accent-red); background: rgba(136, 34, 34, 0.2); box-shadow: inset 0 0 10px rgba(136, 34, 34, 0.5); }
        .size-btn .dim { font-size: 1.4rem; font-weight: bold; display: block; margin-bottom: 5px; font-family: 'Oswald', sans-serif; }
        .size-btn .qty { font-size: 0.85rem; color: #aaa; }

        .qty-controls { display: flex; align-items: center; justify-content: center; gap: 15px; font-size: 1.2rem; margin: 20px 0; }
        .ctrl-btn { background: #333; color: white; border: none; width: 40px; height: 40px; border-radius: 5px; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .ctrl-btn:hover { background: var(--accent-red); }
        .summary-box { background: #111; border: 1px dashed var(--accent-red); padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        .summary-box span { display: block; font-size: 1.1rem; margin: 5px 0; }
        .summary-box .highlight { font-family: 'Oswald', sans-serif; font-size: 1.8rem; color: #25D366; font-weight: bold; }

        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .action-btn { padding: 15px; font-family: 'Oswald', sans-serif; font-size: 1.1rem; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; color: white; text-transform: uppercase; }
        .btn-custom { background: #222; border: 1px solid #444; }
        .btn-catalog { background: var(--accent-red); }
        .btn-custom:hover { background: #333; border-color: #666; }
        .btn-catalog:hover { background: #aa2222; box-shadow: 0 0 15px rgba(170, 34, 34, 0.4); }

        /* --- FILTROS Y PAGINACIÓN --- */
        .tools-panel { background: #111; border: 1px solid rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; text-align: center; }
        .search-bar { width: 100%; max-width: 400px; padding: 10px 15px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 5px; font-size: 1rem; margin-bottom: 1.5rem; outline: none; }
        .search-bar:focus { border-color: var(--accent-red); }
        .alphabet-filter { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
        .letter-btn { background: #1a1a1a; border: 1px solid #333; color: var(--text-muted); padding: 5px 12px; border-radius: 4px; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 1rem; transition: all 0.2s; }
        .letter-btn:hover, .letter-btn.active { background: var(--accent-red); border-color: #ff4444; color: white; }
        
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 100px; width: 100%; }
        .page-btn { background: #1a1a1a; color: white; border: 1px solid #333; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: 'Oswald', sans-serif; transition: all 0.3s; }
        .page-btn:hover:not(:disabled) { background: var(--accent-red); border-color: #ff4444; }
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .page-indicator { font-family: 'Oswald', sans-serif; color: var(--text-muted); font-size: 1.1rem; }

        /* --- CATÁLOGO DE DISEÑOS --- */
        #catalogSection { display: none; margin-top: 30px; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 2rem; }
        .pin-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 15px; text-align: center; }
        .pin-card img { width: 100%; height: 140px; object-fit: contain; margin-bottom: 10px; }
        .pin-title { font-family: 'Oswald', sans-serif; font-size: 1rem; color: #fff; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .item-counter { display: flex; align-items: center; justify-content: space-between; background: #111; border-radius: 4px; border: 1px solid #333; overflow: hidden; }
        .item-counter button { background: #222; color: white; border: none; width: 35px; height: 35px; font-size: 1.2rem; cursor: pointer; }
        .item-counter button:hover { background: var(--accent-red); }
        .item-counter input { width: 40px; background: transparent; border: none; color: white; text-align: center; font-weight: bold; font-size: 1rem; outline: none;}

        .progress-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; border-top: 2px solid var(--accent-red); padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        .progress-text { font-family: 'Oswald', sans-serif; font-size: 1.2rem; }
        .progress-text span { color: #25D366; font-size: 1.5rem; }
        .btn-finish { background: #25D366; color: #000; padding: 10px 20px; font-family: 'Oswald', sans-serif; font-size: 1.1rem; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; opacity: 0.5; pointer-events: none; }
        .btn-finish.ready { opacity: 1; pointer-events: auto; box-shadow: 0 0 15px rgba(37, 211, 102, 0.4); }
        .btn-finish.ready:hover { transform: scale(1.05); }

        /* --- BOTÓN WHATSAPP PRINCIPAL ESTANDARIZADO --- */
        .main-cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #252525 0%, #161616 50%, #0d0d0d 100%);
            border: 1px solid #25D366; 
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }
        .main-cta i { margin-right: 10px; color: #25D366; font-size: 1.3rem; transition: color 0.3s ease; }
        .main-cta:hover {
            border-color: #25D366;
            background: #111;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.2), 0 6px 15px rgba(0, 0, 0, 0.8);
        }

        /* --- CARRUSEL REAL CON FLECHAS --- */
        .carousel-reales-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 2rem auto;
            display: flex;
            align-items: center;
        }
        
        .galeria-reales {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 15px 5px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; 
            scroll-behavior: smooth; 
            width: 100%;
        }
        .galeria-reales::-webkit-scrollbar { display: none; }
        
        .foto-real {
            flex: 0 0 auto;
            width: 260px;
            height: 260px;
            border-radius: 10px;
            scroll-snap-align: center;
            object-fit: cover;
            border: 1px solid #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            background-color: #111;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .foto-real:hover { transform: scale(1.02); }

        .carousel-btn {
            background: rgba(136, 34, 34, 0.9); 
            color: white;
            border: 1px solid #ff4444;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            position: absolute;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }
        .carousel-btn:hover { background: #aa2222; transform: scale(1.1); }
        .prev-btn { left: -20px; }
        .next-btn { right: -20px; }

        @media (max-width: 768px) {
            .carousel-btn { display: none; }
        }
    </style>
</head>
<body>

    <div id="global-header"></div>
    <div class="smoke-container"><div class="smoke-blob smoke-1"></div></div>

    <div class="container">
        
        <header class="header">
            <img src="logo.png" alt="Triqueta Lunar Logo" class="logo-img">
            <h1>Stickers UV DTF</h1>
            <p class="subtitle">Alta adherencia, relieve y resistencia. Arma tu paquete a medida.</p>

            <!-- CARRUSEL REAL DE FOTOS ESTÁTICAS -->
            <div class="carousel-reales-container">
                <button class="carousel-btn prev-btn" onclick="moverCarruselReales('izq', this)">&#10094;</button>
                
                <div class="galeria-reales">
                    <video src="fotos_reales/stickers/video1.mp4" class="foto-real" autoplay loop muted playsinline></video>
                    <img src="fotos_reales/stickers/1.png" class="foto-real" >
                    <img src="fotos_reales/stickers/2.png" class="foto-real" >
                    <img src="fotos_reales/stickers/3.png" class="foto-real" >
                    <img src="fotos_reales/stickers/5.png" class="foto-real" >
                    <img src="fotos_reales/stickers/6.png" class="foto-real" >
                    <img src="fotos_reales/stickers/7.png" class="foto-real" >
                    <img src="fotos_reales/stickers/4.png" class="foto-real" >
                </div>
                
                <button class="carousel-btn next-btn" onclick="moverCarruselReales('der', this)">&#10095;</button>
            </div>

            <a href="https://wa.me/573125935222?text=¡Hola%20Triqueta%20Lunar!%20Vengo%20de%20la%20página%20y%20quiero%20cotizar%20un%20producto%20personalizado." class="main-cta" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-whatsapp"></i> COTIZAR DISEÑO PERSONALIZADO
            </a>
        </header>

        <!-- PASO 1: TAMAÑO -->
        <div class="step-panel" id="step1">
            <h2 class="step-title">1. Selecciona el tamaño</h2>
            <div class="size-grid" id="sizeGrid"></div>
            
            <div style="display: flex; gap: 10px; align-items: center; justify-content: center; margin-top: 15px;">
                <span style="font-family: 'Oswald';">PERSONALIZADO:</span>
                <input type="number" id="customW" placeholder="Ancho" style="width: 70px; padding: 8px; text-align: center; border-radius: 4px; border: 1px solid #555; background: #222; color: white;" min="3" onchange="seleccionarPersonalizado()"> cm
                <span>x</span>
                <input type="number" id="customH" placeholder="Alto" style="width: 70px; padding: 8px; text-align: center; border-radius: 4px; border: 1px solid #555; background: #222; color: white;" min="3" onchange="seleccionarPersonalizado()"> cm
            </div>
        </div>

        <!-- PASO 2: CANTIDAD Y ORIGEN -->
        <div class="step-panel disabled" id="step2">
            <h2 class="step-title">2. Cantidad y Diseño</h2>
            
            <div class="qty-controls">
                <button class="ctrl-btn" onclick="modificarHojas(-1)">-</button>
                <span id="sheetDisplay" style="font-family: 'Oswald'; width: 120px; text-align: center;">1 PAQUETE</span>
                <button class="ctrl-btn" onclick="modificarHojas(1)">+</button>
            </div>

            <div class="summary-box">
                <span id="lblMedida" style="color: #ccc;">Medida seleccionada: --</span>
                <span id="lblTotalStickers" class="highlight">0 STICKERS</span>
                <span id="lblPrecioTotal" style="font-size: 1.2rem;">Por $0 COP</span>
            </div>

            <div class="action-btns">
                <button class="action-btn btn-custom" onclick="añadirDisenoPropio()"><i class="fas fa-upload"></i> Usar mi propio logo</button>
                <button class="action-btn btn-catalog" onclick="abrirCatalogo()"><i class="fas fa-images"></i> Armar surtido del catálogo</button>
            </div>
        </div>

        <!-- PASO 3: CATÁLOGO CON FILTROS Y PAGINACIÓN -->
        <div id="catalogSection">
            <h2 class="step-title">3. Selecciona tus diseños</h2>
            
            <!-- Herramientas de Filtro -->
            <div class="tools-panel" id="toolsPanel">
                <input type="text" class="search-bar" id="searchInput" placeholder="Buscar banda o diseño...">
                <select id="genreFilter" class="search-bar" style="margin-top: -5px; margin-bottom: 1.5rem; cursor: pointer; font-family: 'Oswald', sans-serif; text-transform: uppercase;">
                    <option value="TODOS">🤘 TODOS LOS GÉNEROS</option>
                </select>   
                <div class="alphabet-filter" id="alphabetContainer">
                    <button class="letter-btn active">NUEVOS</button>
                    <button class="letter-btn">A</button><button class="letter-btn">B</button><button class="letter-btn">C</button>
                    <button class="letter-btn">D</button><button class="letter-btn">E</button><button class="letter-btn">F</button>
                    <button class="letter-btn">G</button><button class="letter-btn">H</button><button class="letter-btn">I</button>
                    <button class="letter-btn">J</button><button class="letter-btn">K</button><button class="letter-btn">L</button>
                    <button class="letter-btn">M</button><button class="letter-btn">N</button><button class="letter-btn">O</button>
                    <button class="letter-btn">P</button><button class="letter-btn">Q</button><button class="letter-btn">R</button>
                    <button class="letter-btn">S</button><button class="letter-btn">T</button><button class="letter-btn">U</button>
                    <button class="letter-btn">V</button><button class="letter-btn">W</button><button class="letter-btn">X</button>
                    <button class="letter-btn">Y</button><button class="letter-btn">Z</button>
                </div>
            </div>

            <!-- Cuadrícula -->
            <div class="catalog-grid" id="catalogGrid"></div>

            <!-- Controles de Paginación -->
            <div class="pagination" id="paginationControls"></div>
        </div>
    </div>

    <!-- BARRA FLOTANTE DE PROGRESO -->
    <div class="progress-bar" id="progressBar" style="display: none;">
        <div class="progress-text">
            Seleccionados: <span id="progressCount">0</span> / <span id="progressTotal">0</span>
        </div>
        <button class="btn-finish" id="btnFinishPackage" onclick="finalizarPaqueteSurtido()">AÑADIR AL CARRITO <i class="fas fa-cart-plus"></i></button>
    </div>

    <div id="global-footer"></div>
    <script src="carrito.js"></script>

    <script>
        // CONFIGURACIÓN BASE
        const HOJA_W = 29;
        const HOJA_H = 39;
        const CORTE = 0.5;
        const tamañosBase = [ { w: 3, h: 3 }, { w: 4, h: 4 }, { w: 5, h: 5 }, { w: 6, h: 6 }, { w: 7, h: 7 }, { w: 8, h: 8 } ];

        // Se añade 'precioHojaActual' para que el sistema sepa cuánto cobrar según el tamaño
        let cfg = { w: 0, h: 0, qtyPorHoja: 0, hojas: 1, diseñosSurtidos: {}, precioHojaActual: 20000 };

        // 1. INICIALIZAR LA CUADRÍCULA DE TAMAÑOS
        function initSizes() {
            const grid = document.getElementById('sizeGrid');
            tamañosBase.forEach(t => {
                let qty = calcularCantidad(t.w, t.h);
                let btn = document.createElement('div');
                btn.className = 'size-btn';
                btn.innerHTML = `<span class="dim">${t.w}x${t.h} cm</span><span class="qty">${qty} unds.</span>`;
                btn.onclick = () => seleccionarTamaño(t.w, t.h, btn);
                grid.appendChild(btn);
            });
        }

        function calcularCantidad(w, h) {
            // Inteligencia de márgenes para que no de 0
            let cols = Math.floor((HOJA_W + CORTE) / (w + CORTE));
            let rows = Math.floor((HOJA_H + CORTE) / (h + CORTE));
            return cols * rows;
        }

        // 2. SELECCIÓN DE TAMAÑO Y PRECIO DINÁMICO
        function seleccionarTamaño(w, h, btnElement) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) {
                btnElement.classList.add('active');
                document.getElementById('customW').value = ''; document.getElementById('customH').value = '';
            }

            cfg.w = parseFloat(w); cfg.h = parseFloat(h);
            cfg.qtyPorHoja = calcularCantidad(cfg.w, cfg.h);
            cfg.hojas = 1; cfg.diseñosSurtidos = {}; 

            // --- SISTEMA DE PRECIOS POR TAMAÑO (CONSUMO DE TINTA) ---
            if (cfg.qtyPorHoja <= 2) {
                cfg.precioHojaActual = 45000; // Gigantes (mucha tinta)
            } else if (cfg.qtyPorHoja <= 8) {
                cfg.precioHojaActual = 35000; // Grandes (tinta media-alta)
            } else {
                cfg.precioHojaActual = 20000; // Estándar (precio base)
            }
            
            document.getElementById('catalogSection').style.display = 'none';
            document.getElementById('progressBar').style.display = 'none';
            
            let cartBtn = document.getElementById('openCartBtn');
            if(cartBtn) cartBtn.style.bottom = '30px';
            
            actualizarResumenUI();
            document.getElementById('step2').classList.remove('disabled');
        }

        function seleccionarPersonalizado() {
            let cw = parseFloat(document.getElementById('customW').value);
            let ch = parseFloat(document.getElementById('customH').value);
            
            if(isNaN(cw) || isNaN(ch) || cw < 3 || ch < 3) return;

            // Rota el sticker automáticamente si lo escriben al revés
            let widthToTest = cw;
            let heightToTest = ch;
            if (cw > 28.5 && ch <= 28.5) {
                widthToTest = ch;
                heightToTest = cw;
            }

            // Alerta si excede el máximo permitido
            if (widthToTest > 28.5 || heightToTest > 38.5) {
                alert("El tamaño máximo de impresión por paquete es de 28.5 x 38.5 cm.");
                document.getElementById('customW').value = '';
                document.getElementById('customH').value = '';
                return;
            }

            seleccionarTamaño(widthToTest, heightToTest, null);
        }

        // 3. MULTIPLICADOR
        function modificarHojas(delta) {
            if(cfg.hojas + delta >= 1) {
                cfg.hojas += delta;
                cfg.diseñosSurtidos = {}; 
                actualizarResumenUI();
                if(document.getElementById('catalogSection').style.display === 'block') {
                    actualizarPaginacion(); 
                }
            }
        }

        function actualizarResumenUI() {
            let totalQty = cfg.qtyPorHoja * cfg.hojas;
            // El resumen ahora multiplica por el precio ajustado
            let totalPrice = cfg.precioHojaActual * cfg.hojas; 
            
            document.getElementById('sheetDisplay').innerText = `${cfg.hojas} PAQUETE${cfg.hojas > 1 ? 'S' : ''}`;
            document.getElementById('lblMedida').innerText = `Medida seleccionada: ${cfg.w}x${cfg.h} cm`;
            document.getElementById('lblTotalStickers').innerText = `${totalQty} STICKERS`;
            document.getElementById('lblPrecioTotal').innerText = `Por $${totalPrice.toLocaleString('es-CO')} COP`;
            actualizarProgresoSurtido();
        }

        // 4. ABRIR CATÁLOGO Y CARGAR JSON (Paginado)
        function añadirDisenoPropio() {
            let totalQty = cfg.qtyPorHoja * cfg.hojas;
            let desc = `Medida ${cfg.w}x${cfg.h}cm (${totalQty} uds) - Diseño Propio`;
            // Envia el precio actualizado al carrito
            agregarAlCarrito(desc, 'logo.png', 'Paquete Stickers', cfg.precioHojaActual * cfg.hojas, '');
            document.getElementById('cartSidebar').classList.add('open');
        }
        // 5. RENDERIZADO POR PÁGINAS Y CONTROLES
        function actualizarPaginacion() {
            const inicio = (paginaActual - 1) * pinesPorPagina;
            const pinesAMostrar = listaFiltroActual.slice(inicio, inicio + pinesPorPagina);
            renderizarCatalogo(pinesAMostrar);
            renderizarControlesPaginacion();
        }

        function renderizarControlesPaginacion() {
            const container = document.getElementById('paginationControls');
            container.innerHTML = ''; 
            const totalPaginas = Math.ceil(listaFiltroActual.length / pinesPorPagina);
            if (totalPaginas <= 1) return;

            const btnPrev = document.createElement('button');
            btnPrev.className = 'page-btn';
            btnPrev.innerHTML = '<i class="fas fa-chevron-left"></i> Anterior';
            btnPrev.disabled = paginaActual === 1;
            btnPrev.onclick = () => { if (paginaActual > 1) { paginaActual--; actualizarPaginacion(); document.getElementById('toolsPanel').scrollIntoView(); }};
            container.appendChild(btnPrev);

            const indicador = document.createElement('span');
            indicador.className = 'page-indicator';
            indicador.innerText = `Página ${paginaActual} de ${totalPaginas}`;
            container.appendChild(indicador);

            const btnNext = document.createElement('button');
            btnNext.className = 'page-btn';
            btnNext.innerHTML = 'Siguiente <i class="fas fa-chevron-right"></i>';
            btnNext.disabled = paginaActual === totalPaginas;
            btnNext.onclick = () => { if (paginaActual < totalPaginas) { paginaActual++; actualizarPaginacion(); document.getElementById('toolsPanel').scrollIntoView(); }};
            container.appendChild(btnNext);
        }

        function renderizarCatalogo(lista) {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = '';
            if (lista.length === 0) { grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #888;">No se encontraron diseños.</p>'; return; }

            lista.forEach(pin => {
                // Al cargar la página, lee si ya habíamos asignado stickers a esta banda antes
                let currentQty = cfg.diseñosSurtidos[pin.banda] || 0;
                let safeName = pin.banda.replace(/'/g, "\\'"); 
                
                grid.innerHTML += `
                    <div class="pin-card">
                        <img src="pines/${pin.imagen}" alt="${pin.banda}" loading="lazy">
                        <h3 class="pin-title" title="${pin.banda}">${pin.banda}</h3>
                        <div class="item-counter">
                            <button onclick="cambiarCantidadSurtido('${safeName}', -1)">-</button>
                            <input type="number" id="inp-${safeName}" value="${currentQty}" min="0" onchange="escribirCantidadSurtido('${safeName}', this.value)">
                            <button onclick="cambiarCantidadSurtido('${safeName}', 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }

        // 6. LÓGICA DE FILTROS
        function inicializarFiltros() {
            const searchInput = document.getElementById('searchInput');
            const genreFilter = document.getElementById('genreFilter');
            const letterBtns = document.querySelectorAll('.letter-btn');

            searchInput.addEventListener('input', (e) => {
                genreFilter.value = 'TODOS';
                let t = e.target.value.toLowerCase();
                if(!t) { filtrarPorLetra(letraSeleccionada); return; }
                letterBtns.forEach(b => b.classList.remove('active'));
                listaFiltroActual = catalogoPines.filter(p => p.banda.toLowerCase().includes(t));
                paginaActual = 1; actualizarPaginacion();
            });

            genreFilter.addEventListener('change', (e) => {
                searchInput.value = ''; paginaActual = 1;
                if(e.target.value === 'TODOS') { filtrarPorLetra('NUEVOS'); }
                else { 
                    letterBtns.forEach(b => b.classList.remove('active'));
                    listaFiltroActual = catalogoPines.filter(p => p.macroCategorias.includes(e.target.value));
                    actualizarPaginacion();
                }
            });

            letterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    letraSeleccionada = e.target.innerText;
                    filtrarPorLetra(letraSeleccionada);
                });
            });
        }

        function filtrarPorLetra(letra) {
            letraSeleccionada = letra;
            document.getElementById('searchInput').value = '';
            document.getElementById('genreFilter').value = 'TODOS';
            document.querySelectorAll('.letter-btn').forEach(b => b.classList.toggle('active', b.innerText === letra));
            paginaActual = 1;
            listaFiltroActual = (letra === 'NUEVOS') ? pinesRecientes : catalogoPines.filter(p => p.banda.toUpperCase().startsWith(letra));
            actualizarPaginacion();
        }

        // 7. LÓGICA MATEMÁTICA DEL SURTIDO
        function escribirCantidadSurtido(banda, valor) {
            let maxPermitido = cfg.qtyPorHoja * cfg.hojas;
            let nuevaCantidad = parseInt(valor);
            if (isNaN(nuevaCantidad) || nuevaCantidad < 0) nuevaCantidad = 0;

            let totalActualSinEstaBanda = 0;
            for (let key in cfg.diseñosSurtidos) {
                if (key !== banda) totalActualSinEstaBanda += cfg.diseñosSurtidos[key];
            }

            let espacioDisponible = maxPermitido - totalActualSinEstaBanda;
            
            if (nuevaCantidad > espacioDisponible) {
                alert(`Solo puedes añadir ${espacioDisponible} stickers más para completar tu paquete.`);
                nuevaCantidad = espacioDisponible; 
            }

            if (nuevaCantidad > 0) cfg.diseñosSurtidos[banda] = nuevaCantidad;
            else delete cfg.diseñosSurtidos[banda];

            document.getElementById(`inp-${banda}`).value = nuevaCantidad;
            actualizarProgresoSurtido();
        }

        function cambiarCantidadSurtido(banda, delta) {
            let maxPermitido = cfg.qtyPorHoja * cfg.hojas;
            let totalActual = Object.values(cfg.diseñosSurtidos).reduce((a,b) => a+b, 0);
            let currentItemQty = cfg.diseñosSurtidos[banda] || 0;

            if (delta > 0 && totalActual >= maxPermitido) {
                alert(`¡Ya alcanzaste el límite de ${maxPermitido} stickers para este paquete!`);
                return;
            }

            if (currentItemQty + delta >= 0) {
                cfg.diseñosSurtidos[banda] = currentItemQty + delta;
                if(cfg.diseñosSurtidos[banda] === 0) delete cfg.diseñosSurtidos[banda];
                
                document.getElementById(`inp-${banda}`).value = cfg.diseñosSurtidos[banda] || 0;
                actualizarProgresoSurtido();
            }
        }

        function actualizarProgresoSurtido() {
            let maxPermitido = cfg.qtyPorHoja * cfg.hojas;
            let totalActual = Object.values(cfg.diseñosSurtidos).reduce((a,b) => a+b, 0);
            
            const btn = document.getElementById('btnFinishPackage');
            document.getElementById('progressCount').innerText = totalActual;
            document.getElementById('progressTotal').innerText = maxPermitido;

            if(totalActual === maxPermitido && maxPermitido > 0) {
                btn.classList.add('ready');
                btn.innerText = "FINALIZAR Y AÑADIR";
            } else {
                btn.classList.remove('ready');
                let faltan = maxPermitido - totalActual;
                btn.innerText = `FALTAN ${faltan}`;
            }
        }

        function finalizarPaqueteSurtido() {
            let maxPermitido = cfg.qtyPorHoja * cfg.hojas;
            let totalActual = Object.values(cfg.diseñosSurtidos).reduce((a,b) => a+b, 0);
            if (totalActual !== maxPermitido) return; 

            // CAMBIA ESTA LÍNEA
            let totalPrice = cfg.precioHojaActual * cfg.hojas; 
            
            let resumenBandas = Object.entries(cfg.diseñosSurtidos)
                                .map(([banda, cant]) => `${cant}x ${banda}`)
                                .join(', ');

            let descLarga = `Medida ${cfg.w}x${cfg.h}cm (${maxPermitido} uds) - Surtido: ${resumenBandas}`;
            agregarAlCarrito(descLarga, 'logo.png', 'Paquete Stickers', totalPrice, '');
            
            cfg.diseñosSurtidos = {};
            document.getElementById('catalogSection').style.display = 'none';
            document.getElementById('progressBar').style.display = 'none';
            
            let cartBtn = document.getElementById('openCartBtn');
            if(cartBtn) cartBtn.style.bottom = '30px';
            
            actualizarPaginacion(); 
            actualizarProgresoSurtido();
            
            document.getElementById('cartSidebar').classList.add('open');
        }

        document.addEventListener("DOMContentLoaded", initSizes);

        // Función para los botones del carrusel de fotos reales
        function moverCarruselReales(direccion, boton) {
            const contenedor = boton.parentElement.querySelector('.galeria-reales');
            const cantidadDesplazamiento = 275; // Ancho de la foto + el margen
            
            if (direccion === 'der') {
                contenedor.scrollLeft += cantidadDesplazamiento;
            } else {
                contenedor.scrollLeft -= cantidadDesplazamiento;
            }
        }
    </script>
</body>
</html>
