<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Pines | Triqueta Lunar</title>
    <meta name="description" content="Catálogo completo de pines de bandas en corte láser e impresión 3D.">
    
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --accent-red: #882222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent; 
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* --- NEBLINA EN TONOS ROJOS (Heredado de index.html) --- */
        .smoke-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: #050505; 
            overflow: hidden;
            pointer-events: none;
        }

        .smoke-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(55px); 
            animation: moveSmoke 15s infinite alternate ease-in-out; 
        }

        .smoke-1 { background: radial-gradient(circle, rgba(160, 15, 15, 0.45) 0%, transparent 70%); width: 80vw; height: 80vw; top: -10%; left: -20%; }
        .smoke-2 { background: radial-gradient(circle, rgba(120, 25, 25, 0.35) 0%, transparent 70%); width: 70vw; height: 70vw; top: 40%; right: -20%; animation-delay: -5s; }
        .smoke-3 { background: radial-gradient(circle, rgba(60, 10, 10, 0.4) 0%, transparent 70%); width: 90vw; height: 90vw; bottom: -20%; left: 10%; animation-delay: -10s; }

        @keyframes moveSmoke {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -40px) scale(1.15); }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1000px;
            width: 100%;
        }

        .header { 
            text-align: center;
            margin-bottom: 2rem; 
        }

        .logo-img {
            width: 120px;
            height: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 12px rgba(255,0,0,0.2)); 
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* --- BOTÓN DE DISEÑO PERSONALIZADO --- */
        .custom-design-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #e0e0e0;
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            background: linear-gradient(145deg, #252525 0%, #161616 50%, #0d0d0d 100%);
            border: 1px solid #3a3a3a;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .custom-design-btn i { margin-right: 10px; }
        .custom-design-btn:hover {
            border-color: var(--accent-red);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(200, 20, 20, 0.2), 0 6px 15px rgba(0, 0, 0, 0.8);
        }

        /* --- BUSCADOR Y FILTROS --- */
        .tools-panel {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .search-bar {
            width: 100%;
            max-width: 400px;
            padding: 10px 15px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            outline: none;
        }
        
        .search-bar:focus { border-color: var(--accent-red); }

        .alphabet-filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .letter-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .letter-btn:hover, .letter-btn.active {
            background: var(--accent-red);
            border-color: #ff4444;
            color: white;
        }

        /* --- CUADRÍCULA DEL CATÁLOGO --- */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 4rem;
        }

        .pin-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .pin-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(136, 34, 34, 0.5);
        }

        .pin-card img {
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.6)); 
        }

        .pin-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .add-to-cart-btn {
            width: 100%;
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Roboto', sans-serif;
            font-weight: bold;
            transition: all 0.3s;
        }

        .add-to-cart-btn:hover {
            background: var(--accent-red);
            border-color: #ff4444;
        }

        /* --- CARRITO FLOTANTE STICKY --- */
        .floating-cart {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(145deg, #882222 0%, #551111 100%);
            color: white;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            border: 1px solid #ff4444;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-cart:hover { transform: scale(1.1); }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: white;
            color: #882222;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Oswald', sans-serif;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* --- PANEL LATERAL CARRITO (Oculto por ahora) --- */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 350px;
            max-width: 100vw;
            height: 100vh;
            background: #111;
            border-left: 1px solid #333;
            z-index: 2000;
            transition: right 0.4s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.open { right: 0; }
        
        .close-cart {
            align-self: flex-end;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            margin-bottom: 20px;
        }

    </style>
</head>
<body>

    <!-- Fondo Animado -->
    <div class="smoke-container">
        <div class="smoke-blob smoke-1"></div>
        <div class="smoke-blob smoke-2"></div>
        <div class="smoke-blob smoke-3"></div>
    </div>

    <div class="container">
        <!-- Cabecera -->
        <header class="header">
            <a href="index.html">
                <img src="logo.png" alt="Triqueta Lunar Logo" class="logo-img">
            </a>
            <h1>Catálogo de Pines</h1>
            
            <a href="https://wa.me/573125935222?text=Hola%20Triqueta%20Lunar!%20Quiero%20cotizar%20la%20fabricación%20de%20un%20diseño%20personalizado." 
               class="custom-design-btn" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-whatsapp"></i> COTIZAR DISEÑO PERSONALIZADO
            </a>
        </header>

        <!-- Herramientas: Buscador y Filtro A-Z -->
        <div class="tools-panel">
            <input type="text" class="search-bar" id="searchInput" placeholder="Buscar banda o diseño...">
            
            <div class="alphabet-filter" id="alphabetContainer">
                <button class="letter-btn active">TODOS</button>
                <button class="letter-btn">A</button>
                <button class="letter-btn">B</button>
                <button class="letter-btn">C</button>
                <button class="letter-btn">D</button>
                <button class="letter-btn">E</button>
                <button class="letter-btn">F</button>
                <button class="letter-btn">G</button>
                <button class="letter-btn">H</button>
                <button class="letter-btn">I</button>
                <button class="letter-btn">J</button>
                <button class="letter-btn">K</button>
                <button class="letter-btn">L</button>
                <button class="letter-btn">M</button>
                <button class="letter-btn">N</button>
                <button class="letter-btn">O</button>
                <button class="letter-btn">P</button>
                <button class="letter-btn">Q</button>
                <button class="letter-btn">R</button>
                <button class="letter-btn">S</button>
                <button class="letter-btn">T</button>
                <button class="letter-btn">U</button>
                <button class="letter-btn">V</button>
                <button class="letter-btn">W</button>
                <button class="letter-btn">X</button>
                <button class="letter-btn">Y</button>
                <button class="letter-btn">Z</button>
            </div>
        </div>

        <!-- Cuadrícula de Pines (Muestra temporal de Fase 1) -->
        <div class="catalog-grid" id="catalogGrid">
            
            <!-- Tarjeta de Ejemplo 1 -->
            <div class="pin-card">
                <img src="https://via.placeholder.com/200x200/222222/ffffff?text=Iron+Maiden" alt="Iron Maiden" loading="lazy">
                <h3 class="pin-title">Iron Maiden</h3>
                <button class="add-to-cart-btn"><i class="fas fa-cart-plus"></i> Añadir</button>
            </div>

            <!-- Tarjeta de Ejemplo 2 -->
            <div class="pin-card">
                <img src="https://via.placeholder.com/200x200/222222/ffffff?text=Gorgoroth" alt="Gorgoroth" loading="lazy">
                <h3 class="pin-title">Gorgoroth</h3>
                <button class="add-to-cart-btn"><i class="fas fa-cart-plus"></i> Añadir</button>
            </div>

            <!-- Tarjeta de Ejemplo 3 -->
            <div class="pin-card">
                <img src="https://via.placeholder.com/200x200/222222/ffffff?text=Autopsy" alt="Autopsy" loading="lazy">
                <h3 class="pin-title">Autopsy</h3>
                <button class="add-to-cart-btn"><i class="fas fa-cart-plus"></i> Añadir</button>
            </div>

        </div>
    </div>

    <!-- Botón Flotante del Carrito -->
    <div class="floating-cart" id="openCartBtn">
        <i class="fas fa-shopping-cart"></i>
        <div class="cart-badge" id="cartCount">0</div>
    </div>

    <!-- Panel del Carrito Oculto (Se programará en Fase 3) -->
    <div class="cart-sidebar" id="cartSidebar">
        <button class="close-cart" id="closeCartBtn"><i class="fas fa-times"></i></button>
        <h2 style="font-family: 'Oswald'; text-align: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px;">TU PEDIDO</h2>
        <div id="cartItemsContainer" style="flex-grow: 1; overflow-y: auto;">
            <!-- Aquí irán los items agregados -->
        </div>
        <div style="border-top: 1px solid #333; padding-top: 20px;">
            <p style="display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 15px;">
                <strong>TOTAL:</strong> <span id="cartTotal">$0 COP</span>
            </p>
            <button class="add-to-cart-btn" style="background: #25D366; color: #111; font-size: 1.1rem; padding: 12px; border: none;">
                <i class="fab fa-whatsapp"></i> FINALIZAR COMPRA
            </button>
        </div>
    </div>

    <script>
        let pines = [];
        const grid = document.getElementById('catalogGrid');
        const searchInput = document.getElementById('searchInput');
        const letterBtns = document.querySelectorAll('.letter-btn');
        
        // Leer la memoria del navegador para ver si el usuario ya tenía una letra seleccionada
        let letraSeleccionada = localStorage.getItem('ultimaLetraCatalogo') || 'TODOS';

        // 1. Cargar el inventario JSON
        fetch('catalogo.json')
            .then(response => response.json())
            .then(data => {
                pines = data;
                // Ordenar alfabéticamente por defecto
                pines.sort((a, b) => a.banda.localeCompare(b.banda));
                
                marcarBotonActivo(letraSeleccionada);
                filtrarPorLetra(letraSeleccionada);
            })
            .catch(error => console.error("Error cargando el catálogo:", error));

        // 2. Función para dibujar las tarjetas en la pantalla
        function renderizarCatalogo(lista, limite = null) {
            grid.innerHTML = ''; 
            
            // Si hay un límite (ej. al cargar "TODOS"), cortamos la lista
            const itemsAMostrar = limite ? lista.slice(0, limite) : lista;

            if (itemsAMostrar.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #888;">No se encontraron diseños.</p>';
                return;
            }

            itemsAMostrar.forEach(pin => {
                const card = document.createElement('div');
                card.className = 'pin-card';
                card.innerHTML = `
                    <img src="pines/${pin.imagen}" alt="${pin.banda}" loading="lazy">
                    <h3 class="pin-title">${pin.banda}</h3>
                    <button class="add-to-cart-btn" onclick="agregarAlCarrito('${pin.banda}', '${pin.imagen}')">
                        <i class="fas fa-cart-plus"></i> Añadir
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Lógica del Filtro A-Z
        function filtrarPorLetra(letra) {
            letraSeleccionada = letra;
            localStorage.setItem('ultimaLetraCatalogo', letra); // Guardar en memoria
            searchInput.value = ''; // Limpiar buscador si se usa una letra

            if (letra === 'TODOS') {
                // Mostrar los primeros 30 por defecto para no saturar móviles
                renderizarCatalogo(pines, 30); 
            } else {
                const filtrados = pines.filter(pin => pin.banda.toUpperCase().startsWith(letra));
                renderizarCatalogo(filtrados);
            }
        }

        // 4. Lógica del Buscador de texto
        searchInput.addEventListener('input', (e) => {
            const termino = e.target.value.toLowerCase();
            
            if (termino === '') {
                filtrarPorLetra(letraSeleccionada);
                return;
            }

            // Quitar clase activa de los botones de letras
            letterBtns.forEach(b => b.classList.remove('active'));
            
            const filtrados = pines.filter(pin => pin.banda.toLowerCase().includes(termino));
            renderizarCatalogo(filtrados);
        });

        // 5. Asignar eventos a los botones de la A a la Z
        letterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const letra = e.target.innerText;
                marcarBotonActivo(letra);
                filtrarPorLetra(letra);
            });
        });

        function marcarBotonActivo(letra) {
            letterBtns.forEach(btn => {
                if (btn.innerText === letra) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Función vacía temporal para el carrito (Fase 3)
        function agregarAlCarrito(nombreBanda, imagen) {
            alert("Agregaste " + nombreBanda + ". (El carrito se programará en la Fase 3)");
        }

        // Funciones del panel lateral
        document.getElementById('openCartBtn').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.add('open');
        });
        document.getElementById('closeCartBtn').addEventListener('click', () => {
            document.getElementById('cartSidebar').classList.remove('open');
        });
    </script>
</body>
</html>
